<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwnMyWay — A sua rota personalizada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --purple: #4A2080;
          --light:  #7B3FBE;
          --lav:    #D4B8F0;
          --dark:   #0F0626;
        }

        html, body { height: 100%; }

        body {
          background: #fff;
          color: #1a1a2e;
          font-family: 'DM Sans', sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
          overflow: hidden;
        }

        .top {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 52px 24px 20px;
          position: relative;
          z-index: 2;
          animation: rise 0.9s ease both;
        }

        .badge {
          display: inline-flex; align-items: center; gap: 8px;
          background: rgba(74,32,128,0.08);
          border: 1px solid rgba(74,32,128,0.18);
          color: var(--purple);
          font-size: 11px; font-weight: 500;
          letter-spacing: 0.12em; text-transform: uppercase;
          padding: 7px 18px; border-radius: 100px;
          margin-bottom: 28px;
        }

        .badge-dot {
          width: 6px; height: 6px; border-radius: 50%;
          background: var(--purple);
          animation: pulse 2s infinite;
        }

        h1 {
          font-family: 'Cormorant Garamond', serif;
          font-size: clamp(54px, 11vw, 96px);
          font-weight: 300; line-height: 1.0;
          letter-spacing: -0.02em;
          color: var(--dark);
          margin-bottom: 20px;
        }

        h1 em {
          font-style: italic;
          background: linear-gradient(135deg, var(--purple) 0%, var(--light) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .tagline {
          font-size: clamp(15px, 2.2vw, 18px);
          font-weight: 300;
          color: #666;
          max-width: 440px;
          line-height: 1.65;
          margin-bottom: 36px;
        }

        .pills {
          display: flex; flex-wrap: wrap;
          justify-content: center; gap: 8px;
          margin-bottom: 36px;
        }

        .pill {
          background: rgba(74,32,128,0.06);
          border: 1px solid rgba(74,32,128,0.14);
          color: var(--purple);
          font-size: 13px; font-weight: 400;
          padding: 7px 18px; border-radius: 100px;
        }

        .cta {
          display: inline-flex; align-items: center; gap: 10px;
          background: var(--purple);
          color: #fff; text-decoration: none;
          font-size: 15px; font-weight: 500;
          padding: 14px 34px; border-radius: 100px;
          transition: background 0.25s, transform 0.25s;
          margin-bottom: 8px;
        }
        .cta:hover { background: var(--light); transform: translateY(-2px); }

        .scene {
          width: 100%;
          flex-shrink: 0;
          position: relative;
          z-index: 1;
        }

        .scene svg { display: block; width: 100%; height: auto; }

        @keyframes rise {
          from { opacity: 0; transform: translateY(24px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
          0%,100% { opacity:1; }
          50%      { opacity:0.35; }
        }

        @keyframes drive {
          from { transform: translateX(-160px); }
          to   { transform: translateX(1320px); }
        }

        @keyframes cloudDrift {
          from { transform: translateX(0); }
          to   { transform: translateX(-60px); }
        }

        .car-group { animation: drive 8s linear infinite; }
        .cloud1 { animation: cloudDrift 18s ease-in-out infinite alternate; }
        .cloud2 { animation: cloudDrift 24s ease-in-out 6s infinite alternate-reverse; }

        @media (max-width: 480px) {
          .pills .pill:nth-child(n+4) { display: none; }
        }
    </style>
</head>
